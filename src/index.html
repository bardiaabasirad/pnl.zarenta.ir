<!doctype html>
<html lang="fa" dir="rtl" class="scroll-smooth">
<head>
  <meta charset="utf-8">
  <title>سامانه معاملات</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#ECBD00">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="سامانه معاملات زرنتا">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512x512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <script>
    window.__pwaDeferredPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__pwaDeferredPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-deferred-prompt', { detail: e }));
    });
  </script>
</head>
<body>
  <script>
    (function () {
      var keys = [
        'TApovoFL7K5h7XfGmNC0XOBxk5iv1FuI',
        'brLrMgD1ZiWiPz4dKCWXNuNPeR4NRNaN'
      ];
      var cookies = document.cookie ? document.cookie.split(';') : [];
      var enabled = keys.some(function (key) {
        return cookies.some(function (cookie) {
          return cookie.trim().indexOf(key + '=') === 0;
        });
      });
      if (enabled) {
        document.body.classList.add('dark');
        var themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) {
          themeMeta.setAttribute('content', '#111827');
        }
      }
    })();
  </script>
  <app-root></app-root>
</body>
</html>
