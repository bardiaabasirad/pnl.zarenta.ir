<div class="hidden dark:bg-gray-950/30 lg:block py-8">
  <div class="text-center text-gray-500">&commat; تمامی حقوق برای طلای {{ environment.appTitle }} محفوظ می‌باشد</div>
</div>

<div class="mt-20 lg:hidden">
  <div class="fixed bottom-4 left-1/2 z-40 w-full max-w-lg -translate-x-1/2 px-4">

    <div class="relative h-16 rounded-xl bg-white shadow dark:bg-gray-700">

      <!-- پس‌زمینه‌ی hero که اسلاید می‌شود -->
      <div
        class="pointer-events-none absolute top-0 z-10 flex h-full w-1/3 items-start justify-center transition-all duration-300 ease-out"
        [style.inset-inline-start.%]="activeIndex < 0 ? 0 : activeIndex * 100 / 3"
        [class.opacity-0]="activeIndex < 0"
        [class.scale-90]="activeIndex < 0">
        <div class="-mt-2 inline-flex h-10 w-10 items-center justify-center rounded-full bg-gold-500 hover:bg-yellow-700 focus:outline-none focus:ring-4 focus:ring-yellow-300 dark:focus:ring-yellow-800">
          @switch (activeIndex) {
            @case (0) {
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="size-5 fill-white">
                <path d="M16.043,14H7.957A4.963,4.963,0,0,0,3,18.957V24H21V18.957A4.963,4.963,0,0,0,16.043,14Z"/>
                <circle cx="12" cy="6" r="6"/>
              </svg>
            }
            @case (1) {
              <svg xmlns="http://www.w3.org/2000/svg" class="size-5 fill-white" viewBox="0 0 24 24">
                <path d="m1.423 9.813c-.018-.078-.423-1.949-.423-3.813s.406-3.735.423-3.813c.083-.382.381-.679.762-.763.079-.018 1.95-.424 3.815-.424s3.736.406 3.815.424c.381.084.678.381.762.763.018.078.423 1.949.423 3.813s-.406 3.735-.423 3.813c-.083.382-.381.679-.762.763-.079.018-1.95.424-3.815.424s-3.736-.406-3.815-.424c-.381-.084-.678-.381-.762-.763zm21.153 4.373c-.083-.382-.381-.679-.762-.763-.079-.018-1.95-.424-3.815-.424s-3.736.406-3.815.424c-.381.084-.678.381-.762.763-.018.078-.423 1.949-.423 3.813s.406 3.735.423 3.813c.083.382.381.679.762.763.079.018 1.95.424 3.815.424s3.736-.406 3.815-.424c.381-.084.678-.381.762-.763.018-.078.423-1.949.423-3.813s-.406-3.735-.423-3.813zm-7.178-6.387c.624.5 1.627 0 1.601-.8v-.982c.794.028 1.392.086 1.806.144.114.687.219 2.175.194 3.338 0 .828.671 1.5 1.5 1.5s1.5-.672 1.5-1.5c.078-2.137-.419-5.186-.445-4.964-.121-.483-.474-.875-.942-1.045-.2-.073-1.23-.4-3.614-.475v-1.016c.026-.799-.976-1.3-1.601-.8-1.023.768-1.932 1.676-2.699 2.699-.267.356-.267.845 0 1.201.768 1.023 1.676 1.932 2.699 2.699zm-7.298 8.4c-.624-.5-1.627 0-1.601.8v.982c-.794-.028-1.392-.086-1.806-.144-.114-.687-.219-2.175-.194-3.338 0-.828-.671-1.5-1.5-1.5s-1.5.672-1.5 1.5c-.078 2.137.419 5.186.445 4.964.121.483.474.875.942 1.045.2.073 1.23.4 3.614.475v1.016c-.026.8.976 1.3 1.601.8 1.023-.768 1.932-1.676 2.699-2.699.267-.356.267-.845 0-1.201-.768-1.023-1.676-1.932-2.699-2.699z"/>
              </svg>
            }
            @case (2) {
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="size-5 fill-white">
                <path d="M7,6H23a1,1,0,0,0,0-2H7A1,1,0,0,0,7,6Z"/>
                <path d="M23,11H7a1,1,0,0,0,0,2H23a1,1,0,0,0,0-2Z"/>
                <path d="M23,18H7a1,1,0,0,0,0,2H23a1,1,0,0,0,0-2Z"/>
                <circle cx="2" cy="5" r="2"/>
                <circle cx="2" cy="12" r="2"/>
                <circle cx="2" cy="19" r="2"/>
              </svg>
            }
          }
        </div>
      </div>

      <!-- آیتم‌های نویگیشن (آیکن خاکستری همیشه در جای خود می‌ماند) -->
      <div class="mx-auto flex h-full max-w-lg">

        <a routerLink="/profile" class="group flex flex-1 flex-col items-center justify-center active:text-gray-800">
          <button type="button" class="mb-1.5 inline-flex flex-col items-center justify-center rounded-s-full px-2.5" [class.invisible]="activeIndex === 0">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="size-5 fill-gray-400">
              <path d="M16.043,14H7.957A4.963,4.963,0,0,0,3,18.957V24H21V18.957A4.963,4.963,0,0,0,16.043,14Z"/>
              <circle cx="12" cy="6" r="6"/>
            </svg>
          </button>
          <span class="text-[10px] group-active:text-gray-800" [class.text-gray-500]="activeIndex !== 0">پروفایل</span>
        </a>

        <a routerLink="/" class="group flex flex-1 flex-col items-center justify-center active:text-gray-800">
          <button type="button" class="mb-1.5 inline-flex flex-col items-center justify-center rounded-s-full px-2.5" [class.invisible]="activeIndex === 1">
            <svg xmlns="http://www.w3.org/2000/svg" class="size-5 fill-gray-400" viewBox="0 0 24 24">
              <path d="m1.423 9.813c-.018-.078-.423-1.949-.423-3.813s.406-3.735.423-3.813c.083-.382.381-.679.762-.763.079-.018 1.95-.424 3.815-.424s3.736.406 3.815.424c.381.084.678.381.762.763.018.078.423 1.949.423 3.813s-.406 3.735-.423 3.813c-.083.382-.381.679-.762.763-.079.018-1.95.424-3.815.424s-3.736-.406-3.815-.424c-.381-.084-.678-.381-.762-.763zm21.153 4.373c-.083-.382-.381-.679-.762-.763-.079-.018-1.95-.424-3.815-.424s-3.736.406-3.815.424c-.381.084-.678.381-.762.763-.018.078-.423 1.949-.423 3.813s.406 3.735.423 3.813c.083.382.381.679.762.763.079.018 1.95.424 3.815.424s3.736-.406 3.815-.424c.381-.084.678-.381.762-.763.018-.078.423-1.949.423-3.813s-.406-3.735-.423-3.813zm-7.178-6.387c.624.5 1.627 0 1.601-.8v-.982c.794.028 1.392.086 1.806.144.114.687.219 2.175.194 3.338 0 .828.671 1.5 1.5 1.5s1.5-.672 1.5-1.5c.078-2.137-.419-5.186-.445-4.964-.121-.483-.474-.875-.942-1.045-.2-.073-1.23-.4-3.614-.475v-1.016c.026-.799-.976-1.3-1.601-.8-1.023.768-1.932 1.676-2.699 2.699-.267.356-.267.845 0 1.201.768 1.023 1.676 1.932 2.699 2.699zm-7.298 8.4c-.624-.5-1.627 0-1.601.8v.982c-.794-.028-1.392-.086-1.806-.144-.114-.687-.219-2.175-.194-3.338 0-.828-.671-1.5-1.5-1.5s-1.5.672-1.5 1.5c-.078 2.137.419 5.186.445 4.964.121.483.474.875.942 1.045.2.073 1.23.4 3.614.475v1.016c-.026.8.976 1.3 1.601.8 1.023-.768 1.932-1.676 2.699-2.699.267-.356.267-.845 0-1.201-.768-1.023-1.676-1.932-2.699-2.699z"/>
            </svg>
          </button>
          <span class="text-[10px] group-active:text-gray-800" [class.text-gray-500]="activeIndex !== 1">خرید و فروش</span>
        </a>

        <a routerLink="/orders" class="group flex flex-1 flex-col items-center justify-center active:text-gray-800">
          <button type="button" class="relative mb-1.5 inline-flex flex-col items-center justify-center rounded-s-full px-2.5" [class.invisible]="activeIndex === 2">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="size-5 fill-gray-400">
              <path d="M7,6H23a1,1,0,0,0,0-2H7A1,1,0,0,0,7,6Z"/>
              <path d="M23,11H7a1,1,0,0,0,0,2H23a1,1,0,0,0,0-2Z"/>
              <path d="M23,18H7a1,1,0,0,0,0,2H23a1,1,0,0,0,0-2Z"/>
              <circle cx="2" cy="5" r="2"/>
              <circle cx="2" cy="12" r="2"/>
              <circle cx="2" cy="19" r="2"/>
            </svg>
            @if (hasUnseenUpdate()) {
              <span class="absolute -top-0.5 right-1 h-2.5 w-2.5 rounded-full bg-red-500"></span>
            }
          </button>
          <span class="text-[10px] group-active:text-gray-800" [class.text-gray-500]="activeIndex !== 2">سفارش‌های من</span>
        </a>

      </div>
    </div>
  </div>
</div>
