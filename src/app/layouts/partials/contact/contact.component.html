<button (click)="supportModal?.show()" class="cursor-pointer w-full flex items-center justify-between px-2 lg:px-5 lg:py-2.5" type="button">
  <div class="flex items-center">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="-32 -32 1088 1088" class="size-5 fill-gray-700"><g transform="translate(0, 960) scale(1, -1)"><path d="M129.558 515.71h129.647v-429.19h-129.558c-0.008 0-0.018 0-0.028 0-70.614 0-128.033 56.492-129.528 126.747l-0.002 0.14v167.802c-0.060 1.474-0.094 3.204-0.094 4.942 0 71.553 58.005 129.558 129.558 129.558 0.002 0 0.004 0 0.006 0v0zM170.162 426.667h-40.604c0 0 0 0-0.001 0-22.376 0-40.515-18.139-40.515-40.515 0-0.673 0.016-1.343 0.049-2.008l-0.004 0.094v-169.183c0.787-21.809 18.602-39.203 40.504-39.313h40.526zM764.973 515.71h129.558v-89.043h-40.515v-255.11h40.515c22.366 0.025 40.489 18.149 40.515 40.512v172.168c0.029 0.572 0.045 1.241 0.045 1.914 0 22.36-18.114 40.49-40.469 40.515h-0.002v89.043c0.002 0 0.003 0 0.005 0 71.553 0 129.558-58.005 129.558-129.558 0-1.738-0.034-3.468-0.102-5.189l0.008 0.248v-169.183c-0.076-71.522-58.036-129.482-129.551-129.558h-129.566zM682.162-85.333h-170.073v89.043h170.073c69.31 0.076 125.475 56.242 125.551 125.544v0.007h89.043c-0.127-118.466-96.128-214.468-214.582-214.595h-0.012zM896.757 468.963h-89.043v85.037c0 163.269-132.356 295.624-295.624 295.624s-295.624-132.356-295.624-295.624v0-85.037h-89.043v85.037c0 212.446 172.222 384.668 384.668 384.668s384.668-172.222 384.668-384.668v0z"/></g></svg>
    <span class="text-xs font-semibold mr-2 inline lg:hidden text-sky-600">تماس با ما</span>
    <span class="text-base font-medium mr-2.5 hidden lg:inline">پشتیبانی</span>
  </div>

  <svg class="hidden lg:inline" width="9" height="16" viewBox="0 0 9 16" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M7.57422 1.40008L2.14091 6.83341C1.49924 7.47508 1.49924 8.52508 2.14091 9.16675L7.57422 14.6001" stroke="#414042" stroke-opacity="0.5" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>

<div
  id="supportModal"
  tabindex="-1"
  aria-hidden="true"
  class="fixed left-0 right-0 top-0 z-60 hidden h-[calc(100%-1rem)] max-h-full w-full overflow-y-auto overflow-x-hidden p-4 md:inset-0"
>
  <div class="relative max-h-full w-full max-w-md">
    <!-- Modal content -->
    <div class="relative rounded bg-white shadow dark:bg-gray-700">
      <!-- Modal body -->
      <div class="p-6 space-y-6">
        <div class="space-y-2.5">
          <div class="text-base font-semibold text-center">انتخاب شماره تماس</div>
          <div class="text-center text-gray-400">شماره مورد نظر خود را انتخاب کنید</div>
        </div>
        <div class="max-h-96 overflow-y-auto space-y-2">
          @for (contact of contacts(); track contact.id) {
            <a href="tel:{{ contact.phone }}" class="flex bg-yellow-50 hover:bg-yellow-100/50 justify-between items-centerbg-yellow-50 text-sm border border-gray-300 rounded px-4 py-2.5 space-y-2">
              <div>
                <div class="font-medium">{{ contact.name }}</div>
                <div class="text-sm text-gray-600 hover:text-gray-900">{{ contact.phone }}</div>
              </div>

              <div>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30" class="size-5">
                  <path class="fill-gray-500" d="M21.225,17.889c-0.406-0.238-0.905-0.233-1.309,0.007l-2.046,1.219c-0.458,0.273-1.03,0.241-1.45-0.087 c-0.726-0.567-1.895-1.521-2.912-2.538c-1.017-1.017-1.971-2.186-2.538-2.912c-0.328-0.42-0.36-0.992-0.087-1.45l1.219-2.046 c0.241-0.404,0.243-0.907,0.005-1.313L9.105,3.641c-0.291-0.496-0.869-0.74-1.428-0.603C7.134,3.17,6.429,3.492,5.69,4.232 c-2.314,2.314-3.543,6.217,5.159,14.919s12.604,7.474,14.919,5.159c0.741-0.741,1.062-1.447,1.195-1.991 c0.135-0.558-0.105-1.132-0.6-1.422C25.127,20.174,22.461,18.613,21.225,17.889z"/>
                </svg>
              </div>
            </a>
          }
        </div>
        <div class="flex justify-center">
          <button (click)="supportModal?.hide()" class="cursor-pointer px-4 py-2.5">انصراف</button>
        </div>
      </div>
    </div>
  </div>
</div>
