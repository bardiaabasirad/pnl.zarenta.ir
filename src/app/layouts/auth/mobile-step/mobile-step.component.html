@if (state && state.action && state.action == 'forgot_password') {
  <div class="mb-4">
    <button (click)="back()" class="cursor-pointer flex gap-2 items-center text-gray-500">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
           stroke="currentColor"
           class="size-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 8.25 21 12m0 0-3.75 3.75M21 12H3"/>
      </svg>
      بازگشت
    </button>
  </div>
}

<form [formGroup]="loginByOtpForm" (ngSubmit)="submit()">

  @if (!state || (state && state.action && state.action !== 'forgot_password')) {
    <!--      <div class="mb-4 inline-block text-lg font-semibold text-gray-700 px-2 py-1 rounded-full bg-linear-to-r from-rose-500 via-rose-200 to-rose-500">ورود / ثبت نام</div>-->
  }

  <div class="mb-4">
    <div class="mb-2 relative">
      <label for="mobile" class="mb-2 block text-sm font-medium text-gray-400 dark:text-white sr-only">
        @if (state && state.action && state.action == 'forgot_password') {
          برای تغییر رمز عبور، شماره موبایل خود را وارد کنید
        } @else {
          شماره موبایل خود را وارد کنید
        }
      </label>
      <input type="text"
             formControlName="phone"
             mask="0000000000"
             prefix="0"
             [inputTransformFn]="p2e"
             [validation]="false"
             [dropSpecialCharacters]="false"
             id="mobile"
             placeholder="شماره موبایل"
             class="block w-full rounded border border-gray-200 bg-transparent text-sm text-gray-700 pr-8 p-2.5 focus:border-gray-300/50 focus:ring-gray-300/50 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:focus:border-gray-300/50 dark:focus:ring-gray-300/50"/>
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 absolute right-1 top-2.5 text-gray-200">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 0 0 6 3.75v16.5a2.25 2.25 0 0 0 2.25 2.25h7.5A2.25 2.25 0 0 0 18 20.25V3.75a2.25 2.25 0 0 0-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3" />
      </svg>
    </div>
    <app-error-display [control]="loginByOtpForm.get('phone')" [style]="'text-xs font-medium text-red-500 text-justify'"></app-error-display>
    @if (statusError) {
      <div class="text-xs font-medium text-red-500 text-justify">{{ statusError }}</div>
    }
  </div>

  <div class="mb-4">
    <app-button-with-loader type="submit" class="relative block"
                            classes="bg-linear-to-r from-rose-500 via-rose-600 to-rose-500 shadow rounded w-full py-2.5 border border-rose-500 focus:border-rose-700 focus:outline-none"
                            loading_bg="bg-linear-to-r from-rose-400 via-rose-500 to-rose-400 shadow rounded w-full py-2.5 border border-rose-400 focus:border-rose-600 focus:outline-none"
                            [loading]="submitting"
                            [disabled]="submitting">
      <span class="text-base font-bold text-white">ادامه</span>
    </app-button-with-loader>
  </div>

  <app-cerificate-section></app-cerificate-section>

</form>
