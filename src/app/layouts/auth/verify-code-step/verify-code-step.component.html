<div class="p-6 border-r border-l border-b border-gray-700 rounded-lg min-w-96 max-w-full relative pt-24">

  <div class="absolute inset-0 bg-gray-900/70 rounded-lg -z-10"></div>
  <div class="absolute bottom-0 w-1/2 h-0.5 shadow rounded-t-lg bg-linear-to-r from-transparent via-yellow-200 to-transparent right-1/2 translate-x-1/2"></div>

  <div class="absolute right-0 top-0 w-24 border-t rounded-r-lg h-full border-gray-700 -z-10"></div>
  <div class="absolute left-0 top-0 w-30 border-t rounded-l-lg h-full border-gray-700 -z-10"></div>

    <div class="mb-4">
      <button (click)="back()" type="button" class="cursor-pointer flex gap-2 items-center text-gray-500">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
             class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 8.25 21 12m0 0-3.75 3.75M21 12H3"/>
        </svg>
        بازگشت
      </button>
    </div>

    <div class="text-gray-400">
      <div class="mb-4">کد تایید ارسال شده به شماره {{ verifyForm.get('phone')?.value }} را وارد کنید</div>
    </div>

    <form [formGroup]="verifyForm" (ngSubmit)="verify()">
      <div class="mb-4">
        <div class="mb-2">
          <div class="flex justify-between mb-1.5">
            @if (remainingSeconds) {
              <div class="flex text-amber-400 text-md">
              <span class="aspect-square h-5 w-5 rounded-full bg-amber-400/25">
                <svg class="progress-ring" width="20" height="20">
                  <circle
                    #circle
                    class="origin-center transform stroke-current transition-all duration-350 rotate-[-90deg]"
                    stroke-width="2"
                    fill="transparent"
                    r="8" cx="10" cy="10"
                  />
                  </svg>
                </span>
                <span class="inline-flex w-6 justify-end mr-0.5">{{ remainingSeconds }}</span>
                <span class="mr-1.5">ثانیه</span>
              </div>
            } @else {
              <div (click)="getNewCode()"
                   class="flex cursor-pointer items-center text-md text-info-500">
                <button type="button"
                        [disabled]="isResending()"
                        [class.opacity-60]="isResending()"
                        [class.pointer-events-none]="isResending()"
                        class="cursor-pointer flex group items-center">
                  <svg xmlns="http://www.w3.org/2000/svg"
                       viewBox="0 0 50 50"
                       [class.animate-spin]="isResending()"
                       class="size-4">
                    <path class="fill-sky-600 group-hover:fill-sky-700"
                          d="M25 2C12.321124 2 2 12.321124 2 25C2 37.678876 12.321124 48 25 48C37.678876 48 48 37.678876 48 25 A 2.0002 2.0002 0 1 0 44 25C44 35.517124 35.517124 44 25 44C14.482876 44 6 35.517124 6 25C6 14.482876 14.482876 6 25 6C30.475799 6 35.391893 8.3080175 38.855469 12L35 12 A 2.0002 2.0002 0 1 0 35 16L46 16L46 5 A 2.0002 2.0002 0 0 0 43.970703 2.9726562 A 2.0002 2.0002 0 0 0 42 5L42 9.5253906C37.79052 4.9067015 31.727675 2 25 2 z"/>
                  </svg>
                  <span class="mr-2 text-sky-600 group-hover:text-sky-700 text-sm">دریافت مجدد کد</span>
                </button>
              </div>
            }
            <button type="button"
                    (click)="changeNumber()"
                    class="flex group cursor-pointer items-center"
            >
              <svg xmlns="http://www.w3.org/2000/svg"
                   fill="none"
                   viewBox="0 0 24 24"
                   stroke-width="1.5"
                   stroke="currentColor" class="size-5 text-gray-500 group-hover:text-gray-600">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 15 3 9m0 0 6-6M3 9h12a6 6 0 0 1 0 12h-3"/>
              </svg>

              <span class="text-gray-500 group-hover:text-gray-600 mr-1.5">تغییر شماره</span>
            </button>
          </div>
          <input type="text"
                 formControlName="verification_code"
                 mask="000000"
                 [inputTransformFn]="p2e"
                 name="verification_code"
                 id="verification_code"
                 dir="ltr"
                 placeholder="کد تایید ۶ رقمی"
                 class="block w-full rounded border border-gray-700 bg-transparent text-sm text-white p-2.5 focus:border-yellow-300/50 focus:ring-yellow-300/50 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:focus:border-yellow-300/50 dark:focus:ring-yellow-300/50 [direction:ltr] text-center">
        </div>
        <app-error-display [control]="verifyForm.get('verification_code')" [style]="'text-xs font-medium text-red-500 text-justify'"></app-error-display>
        @if (statusError) {
          <div class="text-xs font-medium text-red-500 text-justify">{{ statusError }}</div>
        }
      </div>

      @if (state && state.force_otp) {
        <div class="text-right mb-4">
          <button (click)="loginByPassword()"
                  type="button"
                  class="cursor-pointer text-sky-500 text-sm inline-flex transition-all duration-300"
          >
            ورود با رمز عبور
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="size-5">
              <path class="fill-sky-500"
                    d="M9.929,12l3.821-3.821c0.414-0.414,0.414-1.086,0-1.5l0,0c-0.414-0.414-1.086-0.414-1.5,0l-4.614,4.614 c-0.391,0.391-0.391,1.024,0,1.414l4.614,4.614c0.414,0.414,1.086,0.414,1.5,0h0c0.414-0.414,0.414-1.086,0-1.5L9.929,12z"/>
            </svg>
          </button>
        </div>
      }

      <div class="mb-4">
        <app-button-with-loader [loading]="submitting()"
                                [disabled]="submitting()"
                                type="submit"
                                classes="bg-linear-to-r from-yellow-500 via-yellow-200 to-yellow-500 shadow rounded w-full py-2.5"
                                loading_bg="bg-linear-to-r from-yellow-500 via-yellow-200 to-yellow-500 shadow">
          <span class="text-base font-bold text-gray-700 ml-2.5">تایید</span>
        </app-button-with-loader>
      </div>

      <div class="flex gap-4">
        <div class="flex-1 flex flex-col items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-8 text-yellow-100">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
          </svg>
          <span class="text-xs">اتصال امن</span>
        </div>
        <div class="w-0.5 bg-linear-to-b from-transparent via-yellow-300/50 from-transparent"></div>
        <div class="flex-1 flex flex-col items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-8 text-yellow-100">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0 0 13.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 0 1-.75.75H9a.75.75 0 0 1-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 0 1 1.927-.184" />
          </svg>
          <span class="text-xs">مجوز اتحادیه طلا</span>
        </div>
        <div class="w-0.5 bg-linear-to-b from-transparent via-yellow-300/50 from-transparent"></div>
        <div class="flex-1 flex flex-col items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-8 text-yellow-100">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z" />
          </svg>
          <span class="text-xs" dir="ltr">256-bit SSL</span>
        </div>
      </div>

    </form>

</div>
