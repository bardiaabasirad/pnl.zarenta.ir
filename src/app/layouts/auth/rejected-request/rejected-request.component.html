<div class="space-y-8 text-center">
  <div class="space-y-2.5">
    <div class="flex items-center gap-2.5">
      <div class="bg-red-500/70 flex justify-center items-center size-6 rounded">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
             class="size-5 text-white">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/>
        </svg>
      </div>
      <div class="font-semibold">درخواست شما رد شده است</div>
    </div>
    <div class="text-gray-600">متأسفانه درخواست ثبت‌نام شما مورد پذیرش قرار نگرفته و دسترسی به پنل کاربری برای شما
      مسدود است. چنانچه فکر می‌کنید این تصمیم نیاز به بررسی مجدد دارد، می‌توانید از طریق دکمه زیر درخواست بازبینی
      ارسال کنید.
    </div>
    <div>
      <app-button-with-loader type="submit" class="relative block"
                              classes="bg-primary rounded-base w-full py-2"
                              loading_bg="bg-primary/70 rounded-base w-full py-2"
                              [loading]="isSubmitting"
                              [disabled]="isSubmitting"
                              (clicked)="onRequestReview()">
        <span class="text-base font-bold text-white">درخواست بررسی مجدد</span>
      </app-button-with-loader>
    </div>
  </div>
</div>
