<div class="mb-4">
  <button (click)="back()" class="cursor-pointer flex gap-2 items-center text-gray-500 dark:text-gray-400">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
         class="size-6">
      <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 8.25 21 12m0 0-3.75 3.75M21 12H3"/>
    </svg>
    بازگشت
  </button>
</div>

<form [formGroup]="form">
  <div class="mb-4">
    <div class="font-medium text-gray-300 mb-2">تکمیل اطلاعات پروفایل</div>
    <div class="text-sm text-gray-400 mb-4">نام، کد ملی و آدرس خود را وارد کنید.</div>
  </div>

  <div class="mb-4">
    <div class="mb-2">
      <label for="full_name" class="mb-2 block text-sm font-medium text-gray-400 dark:text-white sr-only">نام و نام
        خانوادگی</label>
      <input type="text"
             formControlName="full_name"
             id="full_name"
             placeholder="نام و نام خانوادگی خود را وارد کنید"
             (keydown.enter)="submit()"
             class="text-right block w-full rounded-base border border-gray-200 bg-transparent text-sm text-gray-700 p-2.5 focus:border-gray-300 dark:border-gray-700 dark:text-gray-200 dark:focus:border-gray-500"/>
    </div>
    <app-error-display [control]="form.get('full_name')" [style]="'text-xs font-medium text-red-500 text-justify'"></app-error-display>
  </div>

  <div class="mb-4">
    <div class="mb-2">
      <label for="national_code" class="sr-only">کد ملی</label>
      <input type="text"
             formControlName="national_code"
             id="national_code"
             inputmode="numeric"
             pattern="[0-9]*"
             autocomplete="off"
             mask="0000000000"
             [inputTransformFn]="p2e"
             [validation]="false"
             [dropSpecialCharacters]="false"
             placeholder="کد ملی خود را وارد کنید"
             (keydown.enter)="submit()"
             class="text-right block w-full rounded-base border border-gray-200 bg-transparent text-sm text-gray-700 p-2.5 focus:border-gray-300 dark:border-gray-700 dark:text-gray-200 dark:focus:border-gray-500"/>
    </div>
    <app-error-display [control]="form.get('national_code')" [style]="'text-xs font-medium text-red-500 text-justify'"></app-error-display>
  </div>

  <div class="mb-4">
    <div class="mb-2">
      <label for="address" class="sr-only">آدرس</label>
      <textarea formControlName="address"
                id="address"
                rows="3"
                placeholder="آدرس خود را وارد کنید"
                class="text-right block w-full rounded-base border border-gray-200 bg-transparent text-sm text-gray-700 p-2.5 focus:border-gray-300 dark:border-gray-700 dark:text-gray-200 dark:focus:border-gray-500"></textarea>
    </div>
    <app-error-display [control]="form.get('address')" [style]="'text-xs font-medium text-red-500 text-justify'"></app-error-display>
  </div>

  <div>
    <app-button-with-loader type="submit" class="relative block"
                            classes="bg-primary rounded-base w-full py-2"
                            loading_bg="bg-primary/70 rounded-base w-full py-2"
                            [loading]="submitting"
                            [disabled]="submitting"
                            (clicked)="submit()">
      <span class="text-base font-bold text-white">ادامه</span>
    </app-button-with-loader>
  </div>
</form>
