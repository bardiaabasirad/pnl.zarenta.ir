<section id="testimonials" class="mx-auto w-full max-w-6xl py-12" dir="rtl">
  <header class="mb-8 text-center">
    <h2 class="text-2xl font-bold text-slate-900 dark:text-white mb-3">
      نظرات مشتریان
    </h2>
    <p class="text-gray-700 text-lg font-medium">
      تجربه‌ی کاربرانی که با ما همراه بوده‌اند
    </p>
  </header>

  <div class="relative w-full max-w-7xl md:px-10 mx-auto mb-8" dir="rtl">
    <swiper-container #swiper init="false" class="block fade-edges-[4%]">
      @for (item of items; track item.id) {
        <swiper-slide class="h-auto">
          <div class="px-2 py-2 lg:px-4 lg:py-4">
            <article
              class="flex h-full flex-col justify-between rounded-2xl
                 bg-white p-6 shadow-[0px_1.67px_14.22px_0px_rgba(171,172,179,0.42)] lg:shadow-[0px_2px_17px_0px_rgba(171,172,179,0.42)] transition"
            >
              <div class="mb-6">
                <svg width="28" height="22" viewBox="0 0 28 22" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path
                    d="M19.3755 21.3218L14.1581 18.087C16.7089 14.3537 18.019 10.458 18.0886 6.40004L18.0886 3.54551e-05L27.0625 3.62396e-05L27.0625 5.80873C27.0393 8.52178 26.3089 11.3392 24.8712 14.2609C23.4103 17.2058 21.5784 19.5595 19.3755 21.3218ZM5.21902 21.3218L0.00163297 18.087C2.55236 14.3537 3.87409 10.458 3.96684 6.40004L3.96684 3.42205e-05L12.9408 3.50051e-05L12.9408 5.80873C12.8944 8.52178 12.1524 11.3392 10.7147 14.2609C9.277 17.2058 7.44511 19.5595 5.21902 21.3218Z"
                    fill="#5EAD5E"/>
                </svg>
              </div>

              <blockquote class="line-clamp-2 grow text-sm leading-7 text-slate-600 dark:text-slate-300 mb-4">
                {{ item.comment }}
              </blockquote>

              <footer class="flex items-center gap-3">
                <div class="size-12 flex justify-center items-center bg-gray-100 rounded-full p-4">
                  <svg width="16" height="20" viewBox="0 0 16 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                      d="M13.751 11.995C14.3474 11.9955 14.9192 12.2328 15.3407 12.6547C15.7622 13.0766 15.999 13.6486 15.999 14.245V14.82C15.999 15.714 15.679 16.579 15.099 17.258C13.529 19.091 11.142 19.996 7.996 19.996C4.85 19.996 2.464 19.091 0.898 17.256C0.318608 16.5774 0.000207249 15.7143 0 14.822V14.244C0.000265004 13.6476 0.237298 13.0757 0.659009 12.654C1.08072 12.2323 1.65261 11.9953 2.249 11.995H13.751ZM13.751 13.495H2.248C2.04909 13.495 1.85832 13.574 1.71767 13.7147C1.57702 13.8553 1.498 14.0461 1.498 14.245V14.822C1.498 15.357 1.69 15.875 2.038 16.282C3.291 17.751 5.258 18.496 7.995 18.496C10.734 18.496 12.701 17.751 13.958 16.283C14.3066 15.8753 14.4982 15.3564 14.498 14.82V14.244C14.4977 14.0456 14.4189 13.8554 14.2787 13.715C14.1385 13.5746 13.9494 13.4955 13.751 13.495ZM7.996 0C8.65261 -9.78424e-09 9.30279 0.129329 9.90942 0.380602C10.516 0.631876 11.0672 1.00017 11.5315 1.46447C11.9958 1.92876 12.3641 2.47995 12.6154 3.08658C12.8667 3.69321 12.996 4.34339 12.996 5C12.996 5.65661 12.8667 6.30679 12.6154 6.91342C12.3641 7.52004 11.9958 8.07124 11.5315 8.53553C11.0672 8.99983 10.516 9.36812 9.90942 9.6194C9.30279 9.87067 8.65261 10 7.996 10C6.66992 10 5.39815 9.47322 4.46047 8.53553C3.52278 7.59785 2.996 6.32608 2.996 5C2.996 3.67392 3.52278 2.40215 4.46047 1.46447C5.39815 0.526784 6.66992 0 7.996 0ZM7.996 1.5C7.53637 1.5 7.08125 1.59053 6.65661 1.76642C6.23197 1.94231 5.84613 2.20012 5.52113 2.52513C5.19612 2.85013 4.93831 3.23597 4.76242 3.66061C4.58653 4.08525 4.496 4.54037 4.496 5C4.496 5.45963 4.58653 5.91475 4.76242 6.33939C4.93831 6.76403 5.19612 7.14987 5.52113 7.47487C5.84613 7.79988 6.23197 8.05769 6.65661 8.23358C7.08125 8.40947 7.53637 8.5 7.996 8.5C8.92426 8.5 9.8145 8.13125 10.4709 7.47487C11.1273 6.8185 11.496 5.92826 11.496 5C11.496 4.07174 11.1273 3.1815 10.4709 2.52513C9.8145 1.86875 8.92426 1.5 7.996 1.5Z"
                      fill="#A7A9AC"/>
                  </svg>
                </div>
                <div class="min-w-0">
                  <p class="truncate text-sm font-semibold text-slate-900 dark:text-white">
                    {{ item.name }}
                  </p>
                  <p class="truncate text-xs text-slate-500 dark:text-slate-400">
                    {{ item.role }}
                  </p>
                </div>
              </footer>
            </article>
          </div>
        </swiper-slide>
      }
    </swiper-container>

    <!-- دکمه‌های کاملاً سفارشی -->
    <button
      type="button"
      (click)="prev()"
      [disabled]="isBeginning()"
      aria-label="اسلاید قبلی"
      class="cursor-pointer absolute start-0 top-1/2 z-10 hidden md:grid size-11 -translate-y-1/2 translate-x-1/2 place-items-center
           rounded-full bg-white text-gray-600 shadow-lg ring-1 ring-slate-100 transition
           focus-visible:outline-2 focus-visible:outline-offset-2
           focus-visible:outline-gray-600 disabled:pointer-events-none disabled:opacity-40">
      <svg class="size-5 text-gray-700" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 6l6 6-6 6"/>
      </svg>
    </button>

    <button
      type="button"
      (click)="next()"
      [disabled]="isEnd()"
      aria-label="اسلاید بعدی"
      class="cursor-pointer absolute end-0 top-1/2 z-10 hidden md:grid size-11 -translate-x-1/2 -translate-y-1/2 place-items-center
           rounded-full bg-white text-gray-600 shadow-lg ring-1 ring-slate-100 transition
           focus-visible:outline-2 focus-visible:outline-offset-2
           focus-visible:outline-gray-600 disabled:pointer-events-none disabled:opacity-40">
      <svg class="size-5 text-gray-700" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 6l-6 6 6 6"/>
      </svg>
    </button>
  </div>

  <div class="text-gray-700 text-lg font-medium text-center">در بازاری که اعتماد، ارزشمندترین سرمایه است، آن را با
    شفافیت، انصاف و نوآوری می‌سازیم.
  </div>
</section>
