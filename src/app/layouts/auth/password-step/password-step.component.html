<div class="p-6 border-r border-l border-b border-gray-700 rounded-lg min-w-96 max-w-full relative pt-24">

  <div class="absolute inset-0 bg-gray-900/70 rounded-lg -z-10"></div>
  <div class="absolute bottom-0 w-1/2 h-0.5 shadow rounded-t-lg bg-linear-to-r from-transparent via-yellow-200 to-transparent right-1/2 translate-x-1/2"></div>

  <div class="absolute right-0 top-0 w-24 border-t rounded-r-lg h-full border-gray-700 -z-10"></div>
  <div class="absolute left-0 top-0 w-30 border-t rounded-l-lg h-full border-gray-700 -z-10"></div>

  <div class="mb-4">
    <button (click)="back()" class="cursor-pointer flex gap-2 items-center text-gray-500">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
           class="size-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 8.25 21 12m0 0-3.75 3.75M21 12H3"/>
      </svg>
      بازگشت
    </button>
  </div>

  <form [formGroup]="loginByPasswordForm" class="mx-auto w-full">

    <div class="mb-4">
      <div class="mb-2">
        <label for="mobile" class="mb-2 block text-sm font-medium text-gray-400 dark:text-white sr-only">رمز عبور خود
          را وارد کنید</label>
        <input type="password"
               formControlName="password"
               id="mobile"
               placeholder="رمز عبور"
               (keydown.enter)="loginByPassword()"
               class="block w-full rounded border border-gray-700 bg-transparent text-sm text-white p-2.5 focus:border-yellow-300/50 focus:ring-yellow-300/50 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:focus:border-yellow-300/50 dark:focus:ring-yellow-300/50"/>
      </div>
      <app-error-display [control]="loginByPasswordForm.get('password')" [style]="'text-xs font-medium text-red-500 text-justify'"></app-error-display>
      @if (statusError) {
        <!-- مربوط به پیغام غیر فعال بودن حساب کاربری -->
        <div class="text-xs font-medium text-red-500">{{ statusError }}</div>
      }
    </div>

    <div class="mb-4 text-right">
      <div>
        <button (click)="forgotPassword()" type="button"
                class="cursor-pointer text-sky-500 text-sm inline-flex mb-2.5">
          فراموشی رمز عبور
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="size-5">
            <path class="fill-sky-500"
                  d="M9.929,12l3.821-3.821c0.414-0.414,0.414-1.086,0-1.5l0,0c-0.414-0.414-1.086-0.414-1.5,0l-4.614,4.614 c-0.391,0.391-0.391,1.024,0,1.414l4.614,4.614c0.414,0.414,1.086,0.414,1.5,0h0c0.414-0.414,0.414-1.086,0-1.5L9.929,12z"/>
          </svg>
        </button>
      </div>
      <div>
        <button (click)="loginByOtp()" type="button"
                [disabled]="otpLoading"
                class="cursor-pointer text-sky-500 text-sm inline-flex transition-all duration-300"
        >
          ورود با کد یک‌بار مصرف
          @if (otpLoading) {
            <div class="w-12 flex items-center justify-center">
              <div class="dot-loader"></div>
            </div>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="size-5">
              <path class="fill-sky-500"
                    d="M9.929,12l3.821-3.821c0.414-0.414,0.414-1.086,0-1.5l0,0c-0.414-0.414-1.086-0.414-1.5,0l-4.614,4.614 c-0.391,0.391-0.391,1.024,0,1.414l4.614,4.614c0.414,0.414,1.086,0.414,1.5,0h0c0.414-0.414,0.414-1.086,0-1.5L9.929,12z"/>
            </svg>
          }
        </button>
      </div>
    </div>

    <div class="mb-4">
      <app-button-with-loader class="relative block"
                              classes="bg-linear-to-r from-yellow-500 via-yellow-200 to-yellow-500 shadow rounded w-full py-2.5"
                              loading_bg="bg-linear-to-r from-yellow-500 via-yellow-200 to-yellow-500 shadow"
                              [loading]="submitting"
                              [disabled]="submitting"
                              (clicked)="loginByPassword()">
        <span class="text-base font-bold text-gray-700 ml-2.5">ادامه</span>
      </app-button-with-loader>
    </div>

    <div class="flex gap-4">
      <div class="flex-1 flex flex-col items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-8 text-yellow-100">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
        </svg>
        <span class="text-xs">اتصال امن</span>
      </div>
      <div class="w-0.5 bg-linear-to-b from-transparent via-yellow-300/50 from-transparent"></div>
      <div class="flex-1 flex flex-col items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-8 text-yellow-100">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0 0 13.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 0 1-.75.75H9a.75.75 0 0 1-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 0 1 1.927-.184" />
        </svg>
        <span class="text-xs">مجوز اتحادیه طلا</span>
      </div>
      <div class="w-0.5 bg-linear-to-b from-transparent via-yellow-300/50 from-transparent"></div>
      <div class="flex-1 flex flex-col items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-8 text-yellow-100">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z" />
        </svg>
        <span class="text-xs" dir="ltr">256-bit SSL</span>
      </div>
    </div>

  </form>
</div>
