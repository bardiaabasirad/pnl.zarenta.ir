    <div class="lg:hidden">
      <app-balance></app-balance>
    </div>
  }

  <div class="rounded bg-white p-4 shadow">

    <a routerLink="/settings" class="flex items-center justify-between rounded py-3 group active:text-gray-900">

        <div class="w-6">

          </svg>

      </div>
      <svg class="stroke-gray-700 group-active:stroke-gray-900 size-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
      </svg>
    </a>

    @if (user_data && user_data.inquiry_access) {
      <a routerLink="/inquiries" class="flex items-center justify-between rounded py-3 group active:text-gray-900">
        <div class="flex gap-1 items-center text-xs lg:text-sm font-medium text-gray-700">
          <div class="w-6">
            <svg class="size-5 stroke-gray-700 group-active:stroke-gray-900" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
            </svg>
          </div>
          <span class="group-active:text-gray-900">سرویس استعلام</span>
        </div>
        <svg class="stroke-gray-700 group-active:stroke-gray-900 size-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
        </svg>
      </a>
    }

    <button (click)="logout()" class="flex items-center text-xs lg:text-sm font-medium text-rose-500 py-3 group active:text-red-700 lg:hidden">
      <div class="w-6">
        <svg class="size-5" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path class="stroke-rose-500 group-active:stroke-red-700" d="M12.5827 13.7C12.3243 16.7 10.7827 17.925 7.40768 17.925L7.29935 17.925C3.57435 17.925 2.08268 16.4334 2.08268 12.7084L2.08268 7.27505C2.08268 3.55005 3.57435 2.05838 7.29935 2.05838L7.40768 2.05838C10.7577 2.05838 12.2994 3.26672 12.5744 6.21672M7.49935 10L16.9827 10M15.1243 12.7917L17.916 10L15.1244 7.20838" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="mr-2.5">خروج</span>
      @if (loggingOut) {
        <div role="status" class="mr-1">
          <svg aria-hidden="true" class="h-4 w-4 animate-spin fill-rose-400 text-gray-200 dark:text-gray-600" viewBox="0 0 100 101" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z" fill="currentColor"/>
            <path d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z" fill="currentFill"/>

        </div>
      }
    </button>

  </div>
