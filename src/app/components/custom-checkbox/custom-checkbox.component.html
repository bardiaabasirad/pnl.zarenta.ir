<label class="relative inline-flex cursor-pointer items-center">
  <input
    type="checkbox"
    [checked]="isChecked()"
    (change)="onCheckboxChange($any($event.target).checked)"
    class="sr-only peer"
  />
  <span class="text-xs font-medium text-gray-900 me-3 dark:text-gray-300 md:text-sm">
    {{ isChecked() ? activeText() : inactiveText() }}
  </span>
  <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none peer-focus:ring-0 rounded-full peer dark:bg-gray-600 peer-checked:after:translate-x-full rtl:peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:end-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:w-4 after:h-4 after:transition-all dark:border-gray-600 peer-checked:bg-emerald-500"></div>
</label>
