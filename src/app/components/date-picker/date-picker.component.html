<div [ngClass]="style">
  <input [formControl]="dateControl"
         [matDatepicker]="picker"
         (dateChange)="addEvent($event)"
         [placeholder]="placeholder"
         (keydown.enter)="preventDefault($event)"
         class="flex-1 border-none bg-transparent form-control py-2 px-2.5 focus:border-none focus:ring-0 outline-none">
  <label [for]="picker" (click)="picker.open()" class="p-2.5 cursor-pointer">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5 text-gray-600">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" />
    </svg>
  </label>
  <mat-datepicker touchUi startView="multi-year" #picker color="primary"></mat-datepicker>
</div>
